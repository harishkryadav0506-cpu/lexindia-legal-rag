[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lexindia"
version = "0.1.0"
description = "LexIndia — Legal RAG System for Indian Tax Law Research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "elasticsearch>=8.13.0,<9.0.0",
    "sentence-transformers>=2.6.0",
    "torch>=2.0.0",
    "networkx>=3.2.0",
    "openai>=1.14.0",
    "google-genai>=0.1.1",
    "langgraph>=0.0.30",
    "mcp>=1.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]

